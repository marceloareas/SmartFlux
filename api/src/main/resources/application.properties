spring.application.name=api

#DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartflux}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true

# Exibe os valores reais dos parâmetros (?) no console
#logging.level.org.hibernate.orm.jdbc.bind=trace

#Swagger
springdoc.packages-to-scan=com.smartflux.api.controller

# LLM Service
smartflux.llm.url=${LLM_SERVICE_URL:http://localhost:8000}

# E-mail (SMTP Outlook)
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:smartflux1@outlook.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# URL do frontend para o link de reset
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
