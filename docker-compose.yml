version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smartflux_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=smartflux
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: smartflux_backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartflux
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - AVATAR_STORAGE_DIR=/app/avatars
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=10MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=10MB
      - LLM_SERVICE_URL=http://llm-service:8000
      - MAIL_USERNAME=aedf6b001@smtp-brevo.com
      - MAIL_PASSWORD=xsmtpsib-e38d7f48274e93e8ad11db2bf2841cc50d63ba1d3e2d9d813604f64577a3869b-NHldaYGYiLAlsH47
      - SPRING_MAIL_HOST=smtp-relay.brevo.com
      - SPRING_MAIL_PORT=587
      - MAIL_FROM=smartflux1@outlook.com
    volumes:
      - avatars_data:/app/avatars

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: smartflux_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080

  llm-service:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: smartflux_llm_service
    ports:
      - "8000:8000"
    restart: unless-stopped
    shm_size: "2gb"

volumes:
  postgres_data:
  avatars_data:
